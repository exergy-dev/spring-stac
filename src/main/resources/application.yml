spring:
  application:
    name: stac-server

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stac}
    username: ${SPRING_DATASOURCE_USERNAME:stac}
    password: ${SPRING_DATASOURCE_PASSWORD:stac}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
        format_sql: true
    hibernate:
      ddl-auto: none

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/geo+json

stac:
  cors:
    enabled: ${STAC_CORS_ENABLED:true}
    allowed-origins: ${STAC_CORS_ALLOWED_ORIGINS:*}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    max-age: 3600

  repository:
    type: ${STAC_REPOSITORY_TYPE:pgstac}

  pgstac:
    # When true, hydration (link injection, property enrichment) happens at API level
    # When false (default), hydration is done by pgSTAC in the database
    # Equivalent to stac-fastapi-pgstac's USE_API_HYDRATE environment variable
    use-api-hydrate: ${STAC_PGSTAC_USE_API_HYDRATE:false}

  api:
    title: "STAC API"
    description: "SpatioTemporal Asset Catalog API"
    version: "1.0.0"
    root-url: ${STAC_API_ROOT_URL:http://localhost:8080}
    default-limit: 10
    max-limit: 10000

  security:
    enabled: ${STAC_SECURITY_ENABLED:false}
    rate-limit:
      enabled: true
      requests-per-second: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.stac: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
